name: CI cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: ci-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Drop PR dataset
        run: |
          bq --project_id="${{ secrets.DBT_BIGQUERY_PROJECT }}" \
             --location=asia-southeast1 \
             rm -r -f -d "dbt_ci_pr_${{ github.event.pull_request.number }}" || true